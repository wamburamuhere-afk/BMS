<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>Offline | Smart BMS</title>
    <style>
        body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
               font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
               background: #f8f9fa; color: #212529; text-align: center; padding: 16px; box-sizing: border-box; }
        .box { max-width: 380px; }
        .logo { width: 96px; height: 96px; display: block; margin: 0 auto; }
        h1 { font-size: 1.4rem; margin: 20px 0 8px; }
        p { color: #6c757d; margin: 0 0 24px; line-height: 1.5; }
        button { background: #0d6efd; color: #fff; border: 0; border-radius: 6px; padding: 10px 24px; font-size: 1rem; cursor: pointer; }
    </style>
</head>
<body>
    <div class="box">
        <svg class="logo" viewBox="2 2 95 95" aria-label="Smart BMS">
            <g fill="#A9A9AE">
                <rect x="6.25" y="6.25" width="22.5" height="22.5" rx="4"/><rect x="70.25" y="6.25" width="22.5" height="22.5" rx="4"/>
                <rect x="38.25" y="38.25" width="22.5" height="22.5" rx="4"/>
                <rect x="6.25" y="70.25" width="22.5" height="22.5" rx="4"/><rect x="70.25" y="70.25" width="22.5" height="22.5" rx="4"/>
            </g>
            <g stroke="#161B6E" stroke-width="10.8"><line x1="49.5" y1="17.5" x2="81.5" y2="49.5"/><line x1="17.5" y1="49.5" x2="49.5" y2="81.5"/></g>
            <g fill="#161B6E"><circle cx="49.5" cy="17.5" r="15"/><circle cx="81.5" cy="49.5" r="15"/><circle cx="17.5" cy="49.5" r="15"/><circle cx="49.5" cy="81.5" r="15"/></g>
        </svg>
        <h1>You are offline</h1>
        <p>Smart BMS needs an internet connection. Check your connection and try again.<br>
           <small>Hauna mtandao. Tafadhali angalia muunganisho wako kisha ujaribu tena.</small></p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
