<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Solid brand-blue background with rounded corners -->
  <rect width="64" height="64" rx="10" fill="#0b3d91"/>
  <!-- Connecting lines first (behind dots) -->
  <line x1="32" y1="10" x2="16" y2="30" stroke="white" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="32" y1="10" x2="48" y2="30" stroke="white" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="16" y1="30" x2="32" y2="30" stroke="white" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="48" y2="30" stroke="white" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="16" y1="30" x2="24" y2="52" stroke="white" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="24" y2="52" stroke="white" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="32" y1="30" x2="40" y2="52" stroke="white" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <line x1="48" y1="30" x2="40" y2="52" stroke="white" stroke-width="2.5" stroke-opacity="0.55" stroke-linecap="round"/>
  <!-- Dots -->
  <circle cx="32" cy="10" r="5.5" fill="white"/>
  <circle cx="16" cy="30" r="5.5" fill="white"/>
  <circle cx="32" cy="30" r="5.5" fill="white"/>
  <circle cx="48" cy="30" r="5.5" fill="white"/>
  <circle cx="24" cy="52" r="5.5" fill="white"/>
  <circle cx="40" cy="52" r="5.5" fill="white"/>
</svg>
